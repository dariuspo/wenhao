<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ship CLI terminal output mockup">
  <rect width="800" height="500" fill="#0c0f14"/>
  <rect x="0" y="0" width="800" height="34" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#e05561"/>
  <circle cx="46" cy="17" r="6" fill="#e0a355"/>
  <circle cx="68" cy="17" r="6" fill="#5fbf6b"/>
  <rect x="330" y="12" width="140" height="10" rx="5" fill="#2b333f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="24" y="72" fill="#5fbf6b">$</text>
    <text x="44" y="72" fill="#e6edf3">ship deploy --prod</text>

    <text x="24" y="102" fill="#7d8590">›</text>
    <text x="44" y="102" fill="#7d8590">detected</text>
    <text x="124" y="102" fill="#79c0ff">node@20</text>
    <text x="200" y="102" fill="#7d8590">· building image</text>

    <text x="44" y="130" fill="#5fbf6b">✓</text>
    <text x="66" y="130" fill="#e6edf3">deps resolved</text>
    <text x="640" y="130" fill="#7d8590">1.2s</text>

    <text x="44" y="158" fill="#5fbf6b">✓</text>
    <text x="66" y="158" fill="#e6edf3">bundle</text>
    <text x="640" y="158" fill="#7d8590">4.8s</text>

    <text x="44" y="186" fill="#5fbf6b">✓</text>
    <text x="66" y="186" fill="#e6edf3">layers pushed</text>
    <text x="640" y="186" fill="#7d8590">9.1s</text>

    <text x="24" y="228" fill="#d2a8ff">▸</text>
    <text x="44" y="228" fill="#e6edf3">rolling out</text>
  </g>

  <!-- progress bar -->
  <rect x="44" y="246" width="600" height="10" rx="5" fill="#21262d"/>
  <rect x="44" y="246" width="474" height="10" rx="5" fill="#5fbf6b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="660" y="256" fill="#7d8590">79%</text>

    <text x="44" y="292" fill="#7d8590">region</text>
    <text x="140" y="292" fill="#e6edf3">sin  iad  fra</text>

    <text x="44" y="320" fill="#7d8590">preview</text>
    <text x="140" y="320" fill="#79c0ff">https://pr-482.ship.app</text>

    <text x="44" y="348" fill="#7d8590">rollback</text>
    <text x="140" y="348" fill="#e6edf3">ship undo  (instant)</text>

    <text x="24" y="392" fill="#5fbf6b">✓</text>
    <text x="46" y="392" fill="#e6edf3">live in</text>
    <text x="126" y="392" fill="#d2a8ff">18.4s</text>

    <text x="24" y="436" fill="#5fbf6b">$</text>
    <text x="44" y="436" fill="#e6edf3">_</text>
  </g>
  <rect x="56" y="424" width="9" height="16" fill="#5fbf6b" opacity=".8"/>
