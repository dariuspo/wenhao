<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Placeholder for a photo of Wenhao at his desk">
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5a6b"/>
      <stop offset="0.55" stop-color="#5d6b74"/>
      <stop offset="1" stop-color="#3b4650"/>
    </linearGradient>
    <radialGradient id="pd-glow" cx="0.62" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="pd-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#pd-bg)"/>
  <rect width="640" height="480" fill="url(#pd-glow)"/>

  <!-- desk surface -->
  <rect x="0" y="330" width="640" height="150" fill="#2f3841" opacity=".55"/>
  <!-- monitor -->
  <rect x="330" y="120" width="250" height="150" rx="8" fill="#232b33" opacity=".8"/>
  <rect x="346" y="136" width="218" height="118" rx="4" fill="#3f5a7a" opacity=".7"/>
  <rect x="430" y="270" width="50" height="46" fill="#232b33" opacity=".8"/>
  <rect x="392" y="316" width="126" height="12" rx="6" fill="#232b33" opacity=".8"/>
  <!-- laptop -->
  <path d="M96 330 L150 232 L268 232 L292 330 Z" fill="#2b333b" opacity=".75"/>
  <path d="M112 322 L158 242 L260 242 L278 322 Z" fill="#54687d" opacity=".65"/>
  <rect x="80" y="330" width="224" height="12" rx="4" fill="#1f262d" opacity=".8"/>
  <!-- figure -->
  <circle cx="252" cy="196" r="46" fill="#8f7a68" opacity=".75"/>
  <path d="M170 356 q82 -76 164 0 v40 h-164 z" fill="#e8e6e0" opacity=".8"/>
  <!-- mug -->
  <rect x="330" y="296" width="34" height="36" rx="5" fill="#d8d3c8" opacity=".8"/>
  <path d="M364 306 q16 8 0 18" fill="none" stroke="#d8d3c8" stroke-width="5" opacity=".8"/>

  <rect width="640" height="480" filter="url(#pd-grain)" opacity=".55"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" opacity=".55">
    <text x="320" y="454" text-anchor="middle">replace → assets/photo-desk.jpg</text>
  </g>
</svg>
