<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Placeholder for a photo of the workspace">
  <defs>
    <linearGradient id="pw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4a56"/>
      <stop offset="0.6" stop-color="#57646f"/>
      <stop offset="1" stop-color="#2e3740"/>
    </linearGradient>
    <radialGradient id="pw-glow" cx="0.7" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#a7c8ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a7c8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pw-grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="420" height="300" fill="url(#pw-bg)"/>
  <rect width="420" height="300" fill="url(#pw-glow)"/>

  <rect x="0" y="212" width="420" height="88" fill="#262e36" opacity=".6"/>
  <!-- ultrawide monitor -->
  <rect x="150" y="62" width="238" height="112" rx="7" fill="#1e252c" opacity=".85"/>
  <rect x="162" y="74" width="214" height="88" rx="3" fill="#4d7ea8" opacity=".6"/>
  <rect x="252" y="174" width="34" height="34" fill="#1e252c" opacity=".85"/>
  <rect x="222" y="206" width="94" height="9" rx="4.5" fill="#1e252c" opacity=".85"/>
  <!-- laptop -->
  <path d="M30 212 L62 148 L138 148 L152 212 Z" fill="#242c34" opacity=".8"/>
  <path d="M42 206 L68 156 L132 156 L142 206 Z" fill="#5b7085" opacity=".6"/>
  <rect x="20" y="212" width="146" height="9" rx="3" fill="#1a2027" opacity=".85"/>
  <!-- plant -->
  <path d="M356 212 q-6 -40 8 -58 q10 20 4 58 z" fill="#6f9268" opacity=".85"/>
  <path d="M362 212 q22 -30 42 -32 q-8 24 -32 34 z" fill="#5f8259" opacity=".85"/>
  <rect x="346" y="210" width="46" height="30" rx="4" fill="#b98b6c" opacity=".85"/>
  <!-- mug -->
  <rect x="176" y="222" width="26" height="26" rx="4" fill="#ded9ce" opacity=".85"/>
  <path d="M202 229 q12 6 0 13" fill="none" stroke="#ded9ce" stroke-width="4" opacity=".85"/>

  <rect width="420" height="300" filter="url(#pw-grain)" opacity=".55"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#ffffff" opacity=".55">
    <text x="210" y="284" text-anchor="middle">replace → assets/photo-workspace.jpg</text>
  </g>
</svg>
